name: Physics Models CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）自动跑一次
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - model: MEC-001-free-particle
            test: test_MEC001_consistency.py
          - model: MEC-002-forced-particle
            test: test_MEC002_consistency.py

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy

      - name: Run consistency test for ${{ matrix.model }}
        run: |
          cd models/mechanics/${{ matrix.model }}
          python ${{ matrix.test }}
